<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clinica Medicare | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #172033;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 38px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-name {
            font-size: 25px;
            font-weight: 700;
            color: #172033;
        }

        .brand-subtitle {
            margin-top: 6px;
            font-size: 13px;
            color: #6b7280;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #d7dce2;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            color: #172033;
            background: #ffffff;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #e66a1f;
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 9px;
            background: #e66a1f;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .error {
            background: #fff1f1;
            border: 1px solid #fecaca;
            color: #b42318;
        }

        .success {
            background: #ecfdf3;
            border: 1px solid #a7f3d0;
            color: #027a48;
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            .brand-name {
                font-size: 22px;
            }

            .login-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">

        <section class="login-card">

            <div class="brand">
                <div class="brand-name">
                    Clinica Medicare
                </div>

                <div class="brand-subtitle">
                    Hair Test Lead Management
                </div>
            </div>

            <h1 class="login-title">
                Admin Login
            </h1>

            <p class="login-description">
                Sign in to access your leads and manage
                follow-ups.
            </p>

            <div
                id="errorMessage"
                class="message error"
                role="alert"
            ></div>

            <div
                id="successMessage"
                class="message success"
                role="status"
            ></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login to Admin Panel
                </button>

            </form>

            <div class="footer-text">
                © Clinica Medicare
            </div>

        </section>

    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Admin Login -->
    <script src="admin.js"></script>

</body>
</html>
